name: Etkinlik Botu - Telegram Bildirimi

on:
  # Günlük otomatik çalışma (Her gün TR saati 10:00)
  schedule:
    - cron: "*/15 * * * *" # Her 15 dakikada bir (TEST)

  # Manuel test butonu
  workflow_dispatch:

jobs:
  etkinlik-kontrol:
    runs-on: ubuntu-latest

    steps:
      # 1. Kodları çek
      - name: Repository'yi Çek
        uses: actions/checkout@v3

      # 2. Python kur
      - name: Python 3.10 Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3. Chrome kur
      - name: Chrome Kurulumu
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      # 4. Kütüphaneleri yükle
      - name: Gereksinimleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager beautifulsoup4 requests fake-useragent

      # 5. Önceki kayıtları geri yükle (eğer varsa)
      - name: Önceki Kayıtları Yükle
        uses: actions/cache@v3
        with:
          path: gonderilen_linkler.txt
          key: etkinlik-kayitlar-${{ github.run_id }}
          restore-keys: |
            etkinlik-kayitlar-

      # 6. Botu çalıştır
      - name: Etkinlik Botunu Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      # 7. Yeni kayıtları sakla (bir sonraki çalışma için)
      - name: Kayıtları Sakla
        uses: actions/cache@v3
        with:
          path: gonderilen_linkler.txt
          key: etkinlik-kayitlar-${{ github.run_id }}
